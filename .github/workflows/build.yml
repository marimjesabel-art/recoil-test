name: Build C++ EXE Online

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile with MSVC (cl.exe)
      run: |
        # Sử dụng trình biên dịch C++ có sẵn trên môi trường Windows của GitHub Actions
        cmd.exe /c "call C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat x64 && cl.exe /O2 /EHsc main.cpp /link user32.lib"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: RecoilControl-CPP
        path: main.exe
